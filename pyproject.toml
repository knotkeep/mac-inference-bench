[project]
name = "mac-inference-bench"
version = "0.1.0"
description = "Speed and agent-quality benchmark for local inference engines on Apple silicon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rick Clark" }]
dependencies = [
    "httpx>=0.27",
    "huggingface_hub>=0.34",
    "jsonschema>=4.20",
    "psutil>=5.9",
    "typer>=0.12",
]

[project.scripts]
servebench = "servebench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servebench"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
